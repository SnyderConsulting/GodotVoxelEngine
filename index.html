<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxel Sand GPU Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hud">
        <div class="title">Voxel Sand (GPU)</div>
        <div class="hint">FPS: click to lock · WASD move · Space jump · Shift sprint · 1-8 select · LMB use</div>
      </header>
      <canvas id="viewport" width="768" height="512"></canvas>
      <div class="crosshair" aria-hidden="true"></div>
      <div class="suction" aria-hidden="true"></div>
      <div class="hotbar" aria-hidden="true">
        <div class="slot active" data-index="0"><span class="slot-label">1</span><span class="slot-count"></span></div>
        <div class="slot" data-index="1"><span class="slot-label">2</span><span class="slot-count"></span></div>
        <div class="slot" data-index="2"><span class="slot-label">3</span><span class="slot-count"></span></div>
        <div class="slot" data-index="3"><span class="slot-label">4</span><span class="slot-count"></span></div>
        <div class="slot" data-index="4"><span class="slot-label">5</span><span class="slot-count"></span></div>
        <div class="slot" data-index="5"><span class="slot-label">6</span><span class="slot-count"></span></div>
        <div class="slot" data-index="6"><span class="slot-label">7</span><span class="slot-count"></span></div>
        <div class="slot" data-index="7"><span class="slot-label">8</span><span class="slot-count"></span></div>
        <div class="slot" data-index="8"><span class="slot-label">9</span><span class="slot-count"></span></div>
      </div>
      <div class="held-item" aria-hidden="true"></div>
      <div class="footer">
        <span>WebGPU compute + ping-pong buffers</span>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
